<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>NEARU · Acceso privado</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@page{ size:letter; margin:0; }
*{margin:0; padding:0; box-sizing:border-box;}
body{font-family:'Manrope','Helvetica Neue',Arial,sans-serif; color:#171B1A; font-size:11px; line-height:1.55;}
.page{width:8.5in; min-height:11in; padding:0.75in 0.8in; page-break-after:always; position:relative;}
.page:last-child{page-break-after:auto;}
h1{font-size:30px; font-weight:800; color:#123B32; line-height:1.1; letter-spacing:-.5px;}
h2{font-size:16px; font-weight:800; color:#123B32; margin:15px 0 6px; letter-spacing:-.2px; border-bottom:2px solid #B8E34A; padding-bottom:4px;}
h3{font-size:12px; font-weight:800; color:#123B32; margin:10px 0 4px;}
p{margin:5px 0;}
.lead{font-size:12.5px; color:#3a453f;}
.kicker{font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:#739B2E; font-weight:700;}
.brand{font-size:13px; letter-spacing:.16em; font-weight:800; color:#123B32;}
.brand b{color:#739B2E;}
table{width:100%; border-collapse:collapse; margin:6px 0; font-size:9.5px;}
th{background:#123B32; color:#F4EFE5; text-align:left; padding:5px 8px; font-weight:700; font-size:9px; text-transform:uppercase; letter-spacing:.04em;}
td{padding:4.5px 8px; border-bottom:1px solid #e4ddcd; vertical-align:top;}
tr:nth-child(even) td{background:#faf8f2;}
.box{background:#F4EFE5; border-left:4px solid #B8E34A; padding:9px 13px; border-radius:5px; margin:8px 0;}
.box.dark{background:#123B32; color:#F4EFE5; border-left-color:#B8E34A;}
.box.dark b{color:#B8E34A;}
.box.warn{background:#fff8ed; border-left-color:#f5a623;}
.grid2{display:flex; gap:14px;}
.grid2>div{flex:1;}
.metric{background:#fff; border:1px solid #e4ddcd; border-radius:6px; padding:11px; margin:6px 0;}
.metric .big{font-size:22px; font-weight:800; color:#123B32; display:block; line-height:1;}
.metric .lbl{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#739B2E; font-weight:700; margin-top:3px;}
.tag{display:inline-block; font-size:8px; text-transform:uppercase; letter-spacing:.05em; padding:1px 6px; border-radius:20px; color:#fff; background:#739B2E;}
.tag.v{background:#123B32;} .tag.e{background:#f5a623;}
ul{margin:6px 0 6px 18px;} li{margin:3px 0;}
.foot{position:absolute; bottom:0.4in; left:0.8in; right:0.8in; font-size:8px; color:#9a968b; border-top:1px solid #e4ddcd; padding-top:5px; display:flex; justify-content:space-between;}
.cover{background:#123B32; color:#F4EFE5; display:flex; flex-direction:column; justify-content:center; padding:0.9in 0.9in;}
.cover h1{color:#F4EFE5; font-size:42px;}
.cover .brand{color:#F4EFE5; font-size:16px;}
.cover .brand b{color:#B8E34A;}
.disclaimer{font-size:8.5px; color:#b8b2a4;}
</style>
<style>
 html,body{background:#e9e4d8;}
 #gate{position:fixed; inset:0; background:#123B32; display:flex; align-items:center; justify-content:center; z-index:99; padding:20px;}
 #gate .card{background:#F4EFE5; border-radius:14px; padding:34px 30px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4);}
 #gate .brand{font-size:14px; letter-spacing:.16em; font-weight:800; color:#123B32;}
 #gate .brand b{color:#739B2E;}
 #gate h1{font-size:19px; color:#123B32; margin:16px 0 4px; font-weight:800;}
 #gate p{font-size:12px; color:#5a5648; margin-bottom:18px;}
 #gate input{width:100%; padding:12px 14px; border:1.5px solid #cfc7b5; border-radius:8px; font-size:15px; font-family:inherit; text-align:center; letter-spacing:.05em;}
 #gate input:focus{outline:none; border-color:#739B2E;}
 #gate button{width:100%; margin-top:12px; padding:12px; background:#123B32; color:#F4EFE5; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:.03em;}
 #gate button:hover{background:#0d2c25;}
 #gate .err{color:#b3261e; font-size:12px; margin-top:10px; min-height:16px;}
 #gate .lock{font-size:11px; color:#8a8676; margin-top:16px;}
 #content{max-width:8.5in; margin:0 auto; padding:22px 0 10px; display:none;}
 #content .page{min-height:auto !important; width:100%; padding:0.55in 0.65in; margin:0 auto 20px; background:#fff; box-shadow:0 4px 22px rgba(0,0,0,.10); border-radius:6px; page-break-after:auto;}
 #content .page.cover{min-height:auto !important; padding:0.7in; border-radius:10px; background:#123B32 !important; color:#F4EFE5;}
 #content .foot{display:none;}
 #mapsec{display:none; max-width:8.5in; margin:0 auto; padding:0 0 60px;}
 #mapsec .mapcard{background:#fff; border-radius:10px; box-shadow:0 4px 22px rgba(0,0,0,.10); overflow:hidden;}
 #mapsec .maphd{background:#123B32; color:#F4EFE5; padding:16px 22px;}
 #mapsec .maphd .k{font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:#B8E34A; font-weight:700;}
 #mapsec .maphd h2{font-size:20px; font-weight:800; margin-top:3px; border:none; color:#F4EFE5;}
 #mapsec .maphd p{font-size:12px; opacity:.85; margin-top:4px;}
 #mapfilters{padding:12px 22px 4px; background:#faf8f2;}
 #mapfilters .fb{display:inline-block; font-size:12px; padding:5px 11px; border-radius:20px; border:1px solid #cfc7b5; background:#fff; cursor:pointer; margin:3px 4px 3px 0; font-family:inherit;}
 #mapfilters .fb.active{background:#123B32; color:#fff; border-color:#123B32;}
 #salamap{height:560px;}
 .leaflet-popup-content{font-family:'Manrope',Arial,sans-serif; font-size:13px; line-height:1.5;}
 .leaflet-popup-content b{color:#123B32;}
 @media print{ #gate{display:none!important;} #content{display:block!important;} #mapsec{display:none!important;} #content .page{box-shadow:none; margin:0; page-break-after:always;} }
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="brand">NEARU <b>MARKET</b></div>
    <h1>Sala privada</h1>
    <p>Contenido confidencial. Ingresá la clave de acceso.</p>
    <input id="pw" type="password" placeholder="Clave" autocomplete="off" autofocus>
    <button id="go">Entrar</button>
    <div class="err" id="err"></div>
    <div class="lock">🔒 Cifrado AES-256 · solo con clave</div>
  </div>
</div>
<div id="content"></div>
<div id="mapsec">
  <div class="mapcard">
    <div class="maphd">
      <div class="k">Anexo · Mercado</div>
      <h2>Mapa de edificios candidatos · Panamá</h2>
      <p>36 torres y clústeres. ★ = emblemático. Ubicaciones aproximadas por zona.</p>
    </div>
    <div id="mapfilters"></div>
    <div id="salamap"></div>
  </div>
</div>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,b64d(DATA));
  return new TextDecoder().decode(pt);
}
let mapReady=false;
function initMap(){
  if(mapReady||typeof L==='undefined') return; mapReady=true;
  const colors={premium:"#123B32", media:"#739B2E", cluster:"#B8E34A"};
  const map=L.map('salamap',{scrollWheelZoom:true}).setView([8.988,-79.512],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO', maxZoom:19}).addTo(map);
  let markers=[];
  function draw(f){
    markers.forEach(m=>map.removeLayer(m)); markers=[];
    BLDG.filter(b=>f==='all'||b.tier===f||(f==='emblem'&&b.em)).forEach(b=>{
      const c=colors[b.tier];
      const mk=L.circleMarker([b.lat,b.lng],{radius:b.tier==='cluster'?11:(b.em?10:8),fillColor:c,color:'#fff',weight:2,fillOpacity:.92})
        .bindPopup('<b>'+(b.em?'★ ':'')+b.n+'</b><br>'+b.z+'<br>'+b.u);
      mk.addTo(map); markers.push(mk);
    });
  }
  draw('all');
  const fdefs=[['all','Todos'],['emblem','★ Emblemáticos'],['premium','Premium'],['media','Clase media'],['cluster','Clústeres']];
  const fc=document.getElementById('mapfilters');
  fdefs.forEach(([k,l],i)=>{const bt=document.createElement('span'); bt.className='fb'+(i===0?' active':''); bt.textContent=l;
    bt.onclick=()=>{document.querySelectorAll('#mapfilters .fb').forEach(x=>x.classList.remove('active')); bt.classList.add('active'); draw(k);}; fc.appendChild(bt);});
  setTimeout(()=>map.invalidateSize(),200);
}
async function attempt(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err'); err.textContent='';
  try{
    const html=await unlock(pw);
    document.getElementById('content').innerHTML=html;
    document.getElementById('content').style.display='block';
    document.getElementById('mapsec').style.display='block';
    document.getElementById('gate').style.display='none';
    initMap();
  }catch(e){ err.textContent='Clave incorrecta.'; }
}
document.getElementById('go').onclick=attempt;
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') attempt(); });
</script>
