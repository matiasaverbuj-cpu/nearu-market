<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>NEARU · CRM</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#123B32;--marfil:#F4EFE5;--lima:#B8E34A;--musgo:#739B2E;--fondo:#F7F5F0;--linea:#E4DDCD;--carbon:#171B1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--fondo);color:var(--carbon);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;}
#gate{position:fixed;inset:0;background:var(--verde);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;}
#gate .card{background:var(--marfil);border-radius:16px;padding:38px 32px;width:100%;max-width:370px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);}
#gate .brand{font-size:14px;letter-spacing:.18em;font-weight:800;color:var(--verde);}
#gate .brand b{color:var(--musgo);}
#gate h1{font-size:19px;color:var(--verde);margin:16px 0 4px;font-weight:800;}
#gate p{font-size:12.5px;color:#5a5648;margin-bottom:18px;}
#gate input{width:100%;padding:13px 15px;border:1.5px solid #cfc7b5;border-radius:9px;font-size:15px;font-family:inherit;text-align:center;background:#fff;}
#gate input:focus{outline:none;border-color:var(--musgo);}
#gate button{width:100%;margin-top:12px;padding:13px;background:var(--verde);color:var(--marfil);border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
#gate .err{color:#b3261e;font-size:12px;margin-top:10px;min-height:16px;}
#app{display:none;}
header{position:sticky;top:0;z-index:100;background:rgba(247,245,240,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--linea);}
.hd{max-width:1560px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;height:58px;}
.logo{font-size:13px;letter-spacing:.16em;font-weight:800;color:var(--verde);white-space:nowrap;}
.logo b{color:var(--musgo);}
nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:#6b6758;padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;}
nav button:hover{color:var(--verde);}
nav button.on{color:var(--verde);background:rgba(184,227,74,.32);}
.mini{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;color:#3a453f;white-space:nowrap;font-weight:600;}
.mini:hover{border-color:var(--musgo);}
.mini.on{background:var(--verde);color:var(--marfil);border-color:var(--verde);}
main{max-width:1560px;margin:0 auto;padding:18px 20px 70px;}
.barra{margin-bottom:12px;}
#q{width:100%;padding:12px 16px;border:1px solid var(--linea);border-radius:11px;font-size:14.5px;font-family:inherit;background:#fff;}
#q:focus{outline:none;border-color:var(--musgo);box-shadow:0 0 0 3px rgba(184,227,74,.22);}
.chips{margin-top:9px;}
.chip{display:inline-block;font-size:12px;padding:6px 13px;border-radius:20px;border:1px solid #cfc7b5;background:#fff;cursor:pointer;margin:3px 6px 3px 0;user-select:none;}
.chip:hover{border-color:var(--musgo);}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin:12px 0 14px;}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:11px;padding:12px 14px;}
.kpi b{display:block;font-size:21px;font-weight:800;color:var(--verde);line-height:1.1;}
.kpi span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--musgo);font-weight:800;}
.env{display:block;overflow-x:auto;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;min-width:900px;}
th{background:var(--verde);color:var(--marfil);text-align:left;padding:9px 10px;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
td{padding:5px 7px;border-bottom:1px solid var(--linea);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBFAF6;}
.nom{font-weight:700;color:var(--verde);padding-left:11px;min-width:180px;font-size:13px;line-height:1.35;}
.nom small{display:block;font-weight:600;color:#8a8677;font-size:10.5px;margin-top:2px;}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:3px;}
.t-T1{background:#DFF3B8;color:#3c5610;} .t-T2{background:#FFF0C9;color:#77590d;}
.t-T3{background:#EDEAE1;color:#6b6758;} .t-GR{background:#E9DFF7;color:#4a2f75;}
.alerta{display:block;font-size:10.5px;color:#a13a2a;font-weight:700;margin-top:3px;line-height:1.3;}
.acc{white-space:nowrap;padding-right:4px;}
.b{display:inline-block;font-size:11px;font-weight:800;padding:5px 9px;border-radius:7px;text-decoration:none;margin:1px 3px 1px 0;border:1px solid transparent;}
.b-tel{background:var(--verde);color:#fff;} .b-tel:hover{background:#1c5546;}
.b-wa{background:#DFF3B8;color:#33501a;border-color:#c3e08a;}
.b-mail{background:#fff;color:#3a453f;border-color:var(--linea);}
.b-web{background:#fff;color:#8a8677;border-color:var(--linea);}
.b-off{background:#F2EFE7;color:#b3ae9f;cursor:not-allowed;}
.in{width:100%;border:1px solid transparent;background:transparent;font-family:inherit;font-size:12.5px;padding:6px 7px;border-radius:6px;color:inherit;min-width:110px;}
.in:hover{border-color:var(--linea);background:#fff;}
.in:focus{outline:none;border-color:var(--musgo);background:#fff;box-shadow:0 0 0 3px rgba(184,227,74,.22);}
select.in{cursor:pointer;font-weight:700;}
textarea.in{resize:vertical;min-height:34px;min-width:200px;line-height:1.4;}
td.ok{position:relative;}
td.ok:after{content:"guardado";position:absolute;right:5px;top:2px;font-size:8.5px;color:var(--musgo);font-weight:800;text-transform:uppercase;letter-spacing:.05em;animation:fade 2s forwards;}
@keyframes fade{0%,55%{opacity:1}100%{opacity:0}}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.vok{color:var(--musgo);font-weight:800;}
.dim{color:#a5a094;}
.notas{max-width:340px;font-size:11.5px;color:#5f5b4e;line-height:1.45;}
.aviso{border-radius:11px;padding:13px 17px;margin-bottom:14px;font-size:13px;line-height:1.6;}
.aviso.ok{background:#F3F8E9;border-left:4px solid var(--musgo);}
.aviso.no{background:#FFFBF4;border-left:4px solid #d9932a;}
.aviso.mal{background:#FDF0EE;border-left:4px solid #b03a2e;}
.aviso code{background:rgba(0,0,0,.07);padding:1px 6px;border-radius:4px;font-size:11.5px;}
.cuenta{font-size:12px;color:#6b6758;padding:0 2px 7px;}
.guion{display:none;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:22px 24px;margin-bottom:16px;}
.guion h3{font-size:15px;color:var(--verde);margin-bottom:8px;}
.g-lead{font-size:13px;color:#4a4638;margin-bottom:14px;}
.g-b{border-left:3px solid var(--lima);background:#FBFAF4;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:9px;font-size:12.5px;line-height:1.6;color:#3a3628;}
.g-b.g-no{border-left-color:#c0392b;background:#FDF5F3;}
.g-k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--musgo);margin-bottom:3px;}
.g-no .g-k{color:#b03a2e;}
.mini.alta{background:var(--lima);border-color:#a8d63a;color:#33501a;font-weight:800;}
.mini.alta:hover{background:#a8d63a;}
.badge{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:#c0392b;color:#fff;font-size:10px;font-weight:800;text-align:center;margin-left:6px;padding:0 5px;}
.badge:empty{display:none;}
.hoy-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;}
.al{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;}
.al-h{padding:13px 17px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;align-items:center;}
.al-h b{font-size:17px;letter-spacing:0;}
.al.rojo .al-h{background:#FDF0EE;color:#a03024;} .al.rojo{border-color:#f0d4cf;}
.al.ambar .al-h{background:#FFF8ED;color:#8a5d12;} .al.ambar{border-color:#f2e2c4;}
.al.verde .al-h{background:#F3F8E9;color:#4a6b16;}
.al.azul .al-h{background:#EFF6FF;color:#2a4d80;}
.al ul{list-style:none;}
.al li{padding:10px 17px;border-top:1px solid var(--linea);font-size:13px;cursor:pointer;line-height:1.45;}
.al li:hover{background:#FBFAF6;}
.al li b{color:var(--verde);display:block;}
.al li span{font-size:11.5px;color:#8a8677;}
.al li .dias{float:right;font-size:11px;font-weight:800;color:#a03024;}
.al .none{padding:14px 17px;font-size:12.5px;color:#a5a094;}
.hito{background:var(--verde);color:var(--marfil);border-radius:12px;padding:16px 19px;margin-bottom:14px;}
.hito b{display:block;font-size:15px;margin-bottom:3px;}
.hito span{font-size:12.5px;opacity:.85;line-height:1.5;display:block;}
.hito .n{float:right;font-size:26px;font-weight:800;color:var(--lima);line-height:1;}
#velo{display:none;position:fixed;inset:0;background:rgba(23,27,26,.42);z-index:150;backdrop-filter:blur(2px);}
#cajon{display:none;position:fixed;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--fondo);z-index:160;overflow-y:auto;box-shadow:-14px 0 50px rgba(0,0,0,.22);}
#velo.on,#cajon.on{display:block;}
.cj-top{position:sticky;top:0;background:var(--verde);color:var(--marfil);padding:20px 26px 18px;z-index:2;}
.cj-top .eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--lima);margin-bottom:5px;}
.cj-top h3{font-size:21px;line-height:1.25;font-weight:800;margin-bottom:3px;}
.cj-top .sub{font-size:12.5px;opacity:.78;line-height:1.5;}
.cj-x{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.14);border:none;color:var(--marfil);width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;line-height:1;}
.cj-x:hover{background:rgba(255,255,255,.26);}
.cj-acc{padding:14px 26px 0;}
.cj-body{padding:18px 26px 60px;}
.cj-h{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--musgo);margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--linea);}
.cj-h:first-child{margin-top:6px;border-top:none;padding-top:0;}
.cj-alerta{background:#FDF0EE;border-left:3px solid #b03a2e;border-radius:0 8px 8px 0;padding:10px 13px;font-size:12.5px;color:#8c2f22;font-weight:700;margin-bottom:14px;line-height:1.5;}
.cj-fuente{font-size:11.5px;color:#6f6b5c;background:#FBFAF4;border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.55;}
.cj-fuente a{color:var(--musgo);}
.bit{border-left:3px solid var(--lima);background:#fff;border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:9px;font-size:12.5px;line-height:1.55;}
.bit .m{font-size:10px;font-weight:800;color:var(--musgo);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.bit .m b{color:var(--verde);}
.bit .p{margin-top:6px;font-size:11.5px;color:#6f6b5c;}
.bit .del{float:right;background:none;border:none;color:#c4bfae;cursor:pointer;font-size:14px;line-height:1;}
.bit .del:hover{color:#b03a2e;}
.nueva{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:13px 15px;}
.nueva .fila{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.btn{background:var(--verde);color:var(--marfil);border:none;border-radius:9px;padding:11px 18px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;}
.btn:hover{background:#1c5546;}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--linea);}
.btn.sec:hover{border-color:var(--musgo);}
.extra{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.extra .k{font-size:11px;font-weight:800;color:var(--musgo);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;}
.vacio2{font-size:12.5px;color:#a5a094;line-height:1.6;padding:4px 0 10px;}
.ver{background:var(--lima);border:none;color:#33501a;font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;cursor:pointer;margin-top:5px;letter-spacing:.04em;text-transform:uppercase;}
.ver:hover{background:#a8d63a;}
.mapwrap{display:grid;grid-template-columns:1fr 380px;gap:14px;height:calc(100vh - 250px);min-height:480px;}
#map{border-radius:12px;border:1px solid var(--linea);background:#EDEAE1;height:100%;}
#ficha{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:18px 20px;overflow-y:auto;}
#ficha .vacio{color:#a5a094;font-size:13px;line-height:1.6;}
#ficha h4{font-size:16px;color:var(--verde);line-height:1.3;margin-bottom:2px;}
#ficha .sub{font-size:11.5px;color:#8a8677;margin-bottom:14px;}
.f-row{margin-bottom:11px;}
.f-row label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--musgo);margin-bottom:3px;}
.f-row input,.f-row select,.f-row textarea{width:100%;border:1px solid var(--linea);background:#FDFCF9;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;color:inherit;}
.f-row textarea{resize:vertical;min-height:64px;line-height:1.45;}
.f-row input:focus,.f-row select:focus,.f-row textarea:focus{outline:none;border-color:var(--musgo);background:#fff;box-shadow:0 0 0 3px rgba(184,227,74,.22);}
.calc{background:#F3F8E9;border-left:3px solid var(--musgo);border-radius:0 8px 8px 0;padding:11px 13px;margin:13px 0;font-size:12.5px;line-height:1.7;}
.calc b{color:var(--verde);font-variant-numeric:tabular-nums;}
.calc .f{display:block;margin-top:5px;font-weight:800;color:var(--verde);font-size:13.5px;}
.calc .warn{color:#a13a2a;font-weight:700;}
.calc small{display:block;margin-top:6px;color:#6f6b5c;font-size:10.5px;line-height:1.5;}
.f-nota{font-size:11.5px;color:#6f6b5c;line-height:1.5;background:#FBFAF4;border-radius:7px;padding:9px 11px;margin-bottom:12px;}
.f-ok{font-size:11px;color:var(--musgo);font-weight:800;text-transform:uppercase;letter-spacing:.05em;min-height:14px;}
.leyenda{font-size:11px;color:#6b6758;padding:8px 2px 0;}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 12px;vertical-align:-1px;}
.leyenda i:first-child{margin-left:0;}
.marca{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);}
footer{max-width:1560px;margin:0 auto;padding:20px;font-size:11px;color:#9a968b;border-top:1px solid var(--linea);line-height:1.6;}
@media(max-width:760px){
 .hd{gap:8px;padding:0 12px;} main{padding:14px 12px 60px;}
 .nom{min-width:150px;} .notas{max-width:220px;}
 .guion{padding:16px 15px;}
 .mapwrap{grid-template-columns:1fr;height:auto;}
 #map{height:52vh;min-height:320px;}
 #ficha{max-height:none;}
}</style></head><body>

  <div class="brand">NEARU <b>MARKET</b></div>
  <h1>CRM comercial</h1>
  <p>Ingresá la clave de acceso.</p>
  <input id="pw" type="password" placeholder="Clave" autocomplete="off" autofocus>
  <button id="go">Entrar</button>
  <div class="err" id="err"></div>
</div></div>
<div id="app"></div>
